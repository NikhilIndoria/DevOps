version: 0.2

env:
  parameter-store:
    DOCKER_REGISTRY_USERNAME: /cicd/docker-credentials/username
    DOCKER_REGISTRY_PASSWORD: /cicd/docker-credentials/password
    DOCKER_REGISTRY_URL: /cicd/docker-registry/url
phases:
  install:
    runtime-versions:
      nodejs: 22
  pre_build:
    commands:
      - npm ci --legacy-peer-deps
      - npm test -- --watchAll=false
      - npm run build
      - echo "$DOCKER_REGISTRY_PASSWORD" | docker login --username "$DOCKER_REGISTRY_USERNAME" --password-stdin "$DOCKER_REGISTRY_URL"

  build:
    commands:
      - docker build --file Dockerfile.yaml --tag "$DOCKER_REGISTRY_URL/$DOCKER_REGISTRY_USERNAME/swiggy:$CODEBUILD_BUILD_NUMBER" .
      - docker push "$DOCKER_REGISTRY_URL/$DOCKER_REGISTRY_USERNAME/swiggy:$CODEBUILD_BUILD_NUMBER"
      - aws ecs describe-task-definition --task-definition swiggy --region ap-south-1 --query taskDefinition --output json > taskdef.json
      - IMAGE="$DOCKER_REGISTRY_URL/$DOCKER_REGISTRY_USERNAME/swiggy:$CODEBUILD_BUILD_NUMBER" node -e 'const fs = require("fs"); const task = JSON.parse(fs.readFileSync("taskdef.json", "utf8")); for (const key of ["taskDefinitionArn", "revision", "status", "requiresAttributes", "compatibilities", "registeredAt", "registeredBy"]) delete task[key]; const container = task.containerDefinitions.find((item) => item.name === "swiggy"); if (!container) throw new Error("Container swiggy is missing from the task definition"); if (!container.portMappings.some((mapping) => mapping.containerPort === 3000)) throw new Error("Container swiggy must expose port 3000"); container.image = process.env.IMAGE; fs.writeFileSync("taskdef.json", JSON.stringify(task, null, 2) + "\n");'
